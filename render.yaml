services:
  - type: web
    name: tutwithus-ai-api
    runtime: node
    plan: starter
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @tutwithus/api build
    startCommand: corepack pnpm --filter @tutwithus/api start:prod
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_TRUST_PROXY_HOPS
        value: '1'
      - key: TUTWITHUS_API_URL
        value: https://api.tutwithus.com
      - key: TUTWITHUS_TIMEOUT_MS
        value: '5000'
      - key: TUTWITHUS_AUTH_LOGIN_PATH
        value: /auth/login
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: MEMBER_VERIFICATION_SECRET
        generateValue: true
      - key: BROWSER_IDENTITY_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CONSENT_TEXT_EN
        sync: false
      - key: CONSENT_TEXT_FR
        sync: false
      - key: CONSENT_TEXT_AR
        sync: false
      - key: WHATSAPP_CALLING_ENABLED
        value: 'false'
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_LIVEKIT_SIP_TRUNK_ID
        sync: false
      - key: CALLER_HASH_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

  - type: web
    name: tutwithus-ai-web
    runtime: static
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @tutwithus/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: tutwithus-whatsapp-console
    runtime: static
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @tutwithus/whatsapp-console build
    staticPublishPath: apps/whatsapp-console/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
